<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; connect-src 'self' https://raw.githubusercontent.com; img-src 'self' data:; object-src 'none'; base-uri 'none'; form-action 'none'"><title>Kimi 库存 · 只读共享</title><link rel="stylesheet" href="shared.css"><script src="crypto.js" defer></script><script src="shared.js" defer></script></head>
<body><header><a href="#/" class="brand">K<span>Kimi 库存</span></a><span class="pill">只读共享</span><button id="lock" hidden>锁定</button></header>
<main><section id="unlock" class="unlock panel"><p class="eyebrow">KIMI INVENTORY</p><h1>查看库存与日志</h1><p>输入管理员提供的查看密码，读取最后一次同步的数据。</p><form id="unlockForm"><label for="password">查看密码</label><input id="password" type="password" autocomplete="off" required><button type="submit" id="unlockButton">解锁查看</button></form><p id="message" role="status">数据以加密形式保存。密码仅用于本次浏览，不会提交到服务器。</p></section>
<section id="content" hidden><div class="heading"><div><p class="eyebrow">KIMI · PHYSICAL CARD INVENTORY</p><h1>库存与操作记录</h1></div><button id="refresh">刷新线上副本</button></div><div class="sync" id="syncInfo"></div><p class="note">这是本地后台同步的只读副本。电脑离线后保留最后一次同步结果，页面不会接收新的入库或出库操作。</p><div id="metrics" class="metrics"></div><nav><button data-view="cards" class="selected">单卡库存</button><button data-view="batches">到货批次</button><button data-view="logs">操作日志</button></nav>
<div class="filters"><label for="search" class="sr-only">搜索卡号、SKU、批次或日志</label><input id="search" placeholder="搜索卡号、SKU、批次或日志"><label for="status" class="sr-only">库存状态</label><select id="status"><option value="all">全部状态</option><option value="stock">在库</option><option value="pending">待入库</option><option value="out">已出库</option><option value="lost">已记损</option></select><label for="product" class="sr-only">实物产品</label><select id="product"><option value="all">全部产品</option><option value="soft">软盘会员卡</option><option value="cd">音乐光碟</option></select><button id="exportLogs" hidden>导出日志 TXT</button></div>
<div id="results" class="panel"></div><div class="pager"><span id="pageInfo"></span><button id="previous">上一页</button><button id="next">下一页</button></div></section></main><footer>主数据保存在管理员电脑 · 线上仅供查看</footer></body></html>
